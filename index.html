<!-- ALL LOGIC IN REGULAR SCRIPT � no type="module" -->
<script>
/* --- PANEL SWITCHER --------------------------------------- */
function setPanel(name) {
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active') })
  document.querySelectorAll('.et').forEach(function(t) { t.classList.remove('active') })
  var panel = document.getElementById('panel-' + name)
  var btn   = document.getElementById('et-' + name)
  if (panel) panel.classList.add('active')
  if (btn)   btn.classList.add('active')
}

/* --- WAVEFORM --------------------------------------------- */
var wfChannelData = null, wfAudioCtx = null, wfSource = null, wfIsPlaying = false, wfStartTime = 0, wfOffset = 0, wfBuffer = null

function loadWaveform(file) {
  if (!file) return
  document.getElementById('wf-loading').style.display = 'block'
  document.getElementById('wf-loading-msg').textContent = 'Decoding audio�'
  document.getElementById('wf-result').style.display = 'none'
  document.getElementById('wf-dz').style.display = 'none'

  var reader = new FileReader()
  reader.onload = function(e) {
    var ctx = new (window.AudioContext || window.webkitAudioContext)()
    wfAudioCtx = ctx
    ctx.decodeAudioData(e.target.result, function(buffer) {
      wfBuffer = buffer
      wfChannelData = buffer.getChannelData(0)
      document.getElementById('wf-loading').style.display = 'none'
      document.getElementById('wf-result').style.display = 'block'
      var dur = buffer.duration
      var sr  = buffer.sampleRate
      document.getElementById('wf-meta').textContent =
        buffer.numberOfChannels + 'ch � ' + sr.toLocaleString() + ' Hz � ' + formatTime(dur)
      redrawWaveform()
      updateWFTime(0, dur)
      toast(file.name + ' loaded', 'ok')
    }, function(err) {
      document.getElementById('wf-loading').style.display = 'none'
      document.getElementById('wf-dz').style.display = 'flex'
      toast('Could not decode audio: ' + err.message, 'err')
    })
  }
  reader.readAsArrayBuffer(file)
}

function redrawWaveform() {
  if (!wfChannelData) return
  var canvas = document.getElementById('waveform-canvas')
  var wrap   = canvas.parentElement
  var W = wrap.clientWidth * window.devicePixelRatio
  var H = 140 * window.devicePixelRatio
  canvas.width  = W; canvas.height = H
  canvas.style.width = wrap.clientWidth + 'px'; canvas.style.height = '140px'

  var ctx    = canvas.getContext('2d')
  var bgCol  = document.getElementById('wf-bg-color').value
  var wvCol  = document.getElementById('wf-color').value
  var zoom   = parseFloat(document.getElementById('wf-zoom').value) || 1
  var style  = document.getElementById('wf-style').value
  var data   = wfChannelData
  var step   = Math.max(1, Math.floor(data.length / (W * zoom)))

  ctx.fillStyle = bgCol; ctx.fillRect(0, 0, W, H)

  // Center line
  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1; ctx.beginPath()
  ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke()

  ctx.strokeStyle = wvCol; ctx.fillStyle = wvCol

  if (style === 'wave') {
    ctx.lineWidth = 1.5; ctx.beginPath()
    for (var i = 0; i < W; i++) {
      var idx = Math.floor(i * step)
      var v = (data[idx] || 0)
      var y = (0.5 - v * 0.45) * H
      i === 0 ? ctx.moveTo(i, y) : ctx.lineTo(i, y)
    }
    ctx.stroke()
  } else if (style === 'mirror') {
    ctx.lineWidth = 1
    for (var i = 0; i < W; i++) {
      var idx = Math.floor(i * step)
      var v = Math.abs(data[idx] || 0)
      var h = v * H * 0.45
      ctx.fillRect(i, H/2 - h, 1.2, h * 2)
    }
  } else {
    // bars (default)
    ctx.lineWidth = 1
    for (var i = 0; i < W; i++) {
      var min = 1, max = -1
      for (var j = 0; j < step; j++) {
        var s = data[i * step + j] || 0
        if (s < min) min = s; if (s > max) max = s
      }
      var y1 = (0.5 + min * 0.45) * H
      var y2 = (0.5 + max * 0.45) * H
      ctx.fillRect(i, y1, 1.2, Math.max(1, y2 - y1))
    }
  }
}

function togglePlayback() {
  if (!wfBuffer || !wfAudioCtx) return
  if (wfIsPlaying) { pauseWF(); return }
  if (wfAudioCtx.state === 'suspended') wfAudioCtx.resume()
  wfSource = wfAudioCtx.createBufferSource()
  wfSource.buffer = wfBuffer
  wfSource.connect(wfAudioCtx.destination)
  wfSource.start(0, wfOffset)
  wfStartTime = wfAudioCtx.currentTime - wfOffset
  wfIsPlaying = true
  document.getElementById('wf-play-btn').textContent = '? Pause'
  wfSource.onended = function() {
    if (wfIsPlaying) { wfIsPlaying = false; wfOffset = 0; document.getElementById('wf-play-btn').textContent = '? Play' }
  }
  animatePlayhead()
}

function pauseWF() {
  if (!wfIsPlaying) return
  wfOffset = wfAudioCtx.currentTime - wfStartTime
  wfSource.stop(); wfIsPlaying = false
  document.getElementById('wf-play-btn').textContent = '? Play'
}

function stopPlayback() {
  if (wfSource && wfIsPlaying) { wfSource.stop(); wfIsPlaying = false }
  wfOffset = 0; document.getElementById('wf-play-btn').textContent = '? Play'
  document.getElementById('wf-playhead').style.left = '0'
  if (wfBuffer) updateWFTime(0, wfBuffer.duration)
}

function animatePlayhead() {
  if (!wfIsPlaying || !wfBuffer) return
  var elapsed = wfAudioCtx.currentTime - wfStartTime
  var pct = elapsed / wfBuffer.duration
  var canvas = document.getElementById('waveform-canvas')
  var ph = document.getElementById('wf-playhead')
  ph.style.display = 'block'
  ph.style.left = (pct * canvas.clientWidth) + 'px'
  updateWFTime(elapsed, wfBuffer.duration)
  requestAnimationFrame(animatePlayhead)
}

function updateWFTime(current, total) {
  document.getElementById('wf-time').textContent = formatTime(current) + ' / ' + formatTime(total)
}

function formatTime(s) {
  var m = Math.floor(s / 60), sec = Math.floor(s % 60)
  return m + ':' + (sec < 10 ? '0' : '') + sec
}

function exportWaveformPNG() {
  var canvas = document.getElementById('waveform-canvas')
  var a = document.createElement('a'); a.download = 'waveform.png'; a.href = canvas.toDataURL(); a.click()
  toast('Waveform saved', 'ok')
}

// Resize
window.addEventListener('resize', function() { if (wfChannelData) redrawWaveform() })

/* --- SCREEN RECORDER -------------------------------------- */
var mediaRecorder = null, recChunks = [], recInterval = null, recSeconds = 0, recBlob = null, recStream = null

function startRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    toast('Screen recording not supported in this browser', 'err'); return
  }
  var opts = { video: { frameRate: 30 }, audio: false }
  var hasMic = document.getElementById('rec-mic').checked

  navigator.mediaDevices.getDisplayMedia(opts).then(function(displayStream) {
    recStream = displayStream
    var tracks = displayStream.getTracks()

    if (hasMic && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(micStream) {
        var combined = new MediaStream([...tracks, ...micStream.getAudioTracks()])
        beginRecord(combined)
      }).catch(function() {
        toast('Mic access denied � recording screen only', 'info')
        beginRecord(displayStream)
      })
    } else {
      beginRecord(displayStream)
    }
  }).catch(function(e) {
    if (e.name !== 'NotAllowedError') toast('Screen access denied: ' + e.message, 'err')
  })
}

function beginRecord(stream) {
  recChunks = []; recBlob = null
  var mimeTypes = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4']
  var mimeType = mimeTypes.find(function(m) { return MediaRecorder.isTypeSupported(m) }) || ''

  mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType: mimeType } : {})
  mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) recChunks.push(e.data) }
  mediaRecorder.onstop = function() {
    recBlob = new Blob(recChunks, { type: mimeType || 'video/webm' })
    var url = URL.createObjectURL(recBlob)
    var pb = document.getElementById('rec-playback')
    pb.src = url; pb.style.display = 'block'
    document.getElementById('rec-preview').style.display = 'none'
    document.getElementById('rec-dl-btn').style.display = 'inline-flex'
    document.getElementById('rec-new-btn').style.display = 'inline-flex'
    document.getElementById('rec-size-info').style.display = 'block'
    document.getElementById('rec-size-info').textContent = 'File size: ' + (recBlob.size / 1024 / 1024).toFixed(1) + ' MB � ' + (mimeType || 'video/webm')
    setRecStatus('idle', '? Recording complete')
    clearInterval(recInterval)
  }
  mediaRecorder.start(1000)
  recSeconds = 0

  var preview = document.getElementById('rec-preview')
  preview.srcObject = stream; preview.style.display = 'block'
  document.getElementById('rec-stop-btn').style.display = 'inline-flex'
  document.getElementById('rec-pause-btn').style.display = 'inline-flex'
  document.getElementById('rec-start-btn').style.display = 'none'
  document.getElementById('rec-timer').style.display = 'inline'

  setRecStatus('live', '?? Recording�')
  recInterval = setInterval(function() {
    recSeconds++
    var m = Math.floor(recSeconds / 60), s = recSeconds % 60
    document.getElementById('rec-timer').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s
  }, 1000)

  stream.getTracks().forEach(function(t) { t.onended = function() { stopRecording() } })
}

function pauseRecording() {
  if (!mediaRecorder) return
  if (mediaRecorder.state === 'recording') {
    mediaRecorder.pause(); setRecStatus('paused', '? Paused')
    document.getElementById('rec-pause-btn').textContent = '? Resume'
  } else if (mediaRecorder.state === 'paused') {
    mediaRecorder.resume(); setRecStatus('live', '?? Recording�')
    document.getElementById('rec-pause-btn').textContent = '? Pause'
  }
}

function stopRecording() {
  if (mediaRecorder && (mediaRecorder.state === 'recording' || mediaRecorder.state === 'paused')) {
    mediaRecorder.stop()
    if (recStream) recStream.getTracks().forEach(function(t) { t.stop() })
    document.getElementById('rec-stop-btn').style.display = 'none'
    document.getElementById('rec-pause-btn').style.display = 'none'
  }
}

function downloadRecording() {
  if (!recBlob) return
  var a = document.createElement('a')
  a.href = URL.createObjectURL(recBlob)
  a.download = 'recording-' + new Date().toISOString().slice(0,19).replace(/[T:]/g,'-') + '.webm'
  a.click(); toast('Downloading recording', 'ok')
}

function newRecording() {
  document.getElementById('rec-playback').style.display = 'none'
  document.getElementById('rec-start-btn').style.display = 'inline-flex'
  document.getElementById('rec-dl-btn').style.display = 'none'

function setRecStatus(state, text) {

}

/* --- THUMBNAILS ------------------------------------------- */
var thVideo = null, thThumbs = []

document.getElementById('th-mode').onchange = function() {
  var mode = this.value
  document.getElementById('th-interval-wrap').style.display = mode === 'interval' ? 'block' : 'none'
  document.getElementById('th-count-wrap').style.display    = mode === 'count'    ? 'block' : 'none'
  document.getElementById('th-seek-wrap').style.display     = mode === 'seek'     ? 'block' : 'none'
}
document.getElementById('ff-op').onchange = function() {
  document.getElementById('ff-trim-wrap').style.display = this.value === 'trim' ? 'flex' : 'none'
}

function loadThumbVideo(file) {
  if (!file || !file.type.startsWith('video/')) { toast('Please select a video file', 'err'); return }
  var video = document.getElementById('th-video')
  video.src = URL.createObjectURL(file)
  video.onloadedmetadata = function() {
    thVideo = video
    document.getElementById('th-controls').style.display = 'block'
    document.getElementById('th-dz').querySelector('h3').textContent = '? ' + file.name
    document.getElementById('th-dz').querySelector('p').textContent = formatTime(video.duration) + ' � ' + (file.size/1024/1024).toFixed(1) + ' MB'
    toast('Video ready: ' + formatTime(video.duration), 'ok')
  }
}

function extractThumbs() {
  if (!thVideo) { toast('Load a video first', 'err'); return }
  var mode = document.getElementById('th-mode').value
  var dur  = thVideo.duration
  var times = []

  if (mode === 'interval') {
    var iv = parseFloat(document.getElementById('th-interval').value) || 5
    for (var t = 0; t < dur; t += iv) times.push(t)
  } else if (mode === 'count') {
    var cnt = parseInt(document.getElementById('th-count').value) || 10
    for (var i = 0; i < cnt; i++) times.push((i / (cnt - 1)) * dur)
  } else {
    times = document.getElementById('th-seeks').value.split(',')
      .map(function(s) { return parseFloat(s.trim()) })
      .filter(function(n) { return !isNaN(n) && n >= 0 && n <= dur })
  }

  if (!times.length) { toast('No valid timestamps', 'err'); return }
  times = times.slice(0, 100)

  document.getElementById('th-prog-bar').style.display = 'block'
  document.getElementById('th-prog-msg').style.display = 'block'
  document.getElementById('th-results').style.display = 'none'
  thThumbs = []

  var canvas = document.createElement('canvas')
  var i = 0

  function captureNext() {
    if (i >= times.length) {
      document.getElementById('th-prog-bar').style.display = 'none'
      document.getElementById('th-prog-msg').style.display = 'none'
      renderThumbStrip()
      return
    }
    var t = times[i]
    thVideo.currentTime = t
    thVideo.onseeked = function() {
      canvas.width  = thVideo.videoWidth  || 640
      canvas.height = thVideo.videoHeight || 360
      canvas.getContext('2d').drawImage(thVideo, 0, 0)
      canvas.toBlob(function(blob) {
        thThumbs.push({ time: t, blob: blob, url: URL.createObjectURL(blob) })
        var pct = Math.round((i + 1) / times.length * 100)
        document.getElementById('th-prog-fill').style.width = pct + '%'
        document.getElementById('th-prog-msg').textContent = 'Extracting frame ' + (i+1) + ' / ' + times.length
        i++
        captureNext()
      }, 'image/jpeg', 0.88)
    }
  }
  captureNext()
}

function renderThumbStrip() {
  var strip = document.getElementById('thumb-strip-wrap')
  strip.innerHTML = thThumbs.map(function(th, i) {
    return '<img src="' + th.url + '" title="' + formatTime(th.time) + '" onclick="downloadSingleThumb(' + i + ')" alt="Frame at ' + formatTime(th.time) + '">'
  }).join('')
  document.getElementById('th-count-label').textContent = '? ' + thThumbs.length + ' frames extracted � click to download'
  document.getElementById('th-results').style.display = 'block'
  toast(thThumbs.length + ' frames extracted', 'ok')
}

function downloadSingleThumb(i) {
  var a = document.createElement('a'); a.href = thThumbs[i].url; a.download = 'frame-' + formatTime(thThumbs[i].time).replace(':','-') + '.jpg'; a.click()
}

function downloadAllThumbs() {
  thThumbs.forEach(function(th, i) {
    setTimeout(function() {
      var a = document.createElement('a'); a.href = th.url; a.download = 'frame-' + String(i+1).padStart(3,'0') + '.jpg'; a.click()
    }, i * 80)
  })
  toast('Downloading ' + thThumbs.length + ' frames', 'ok')
}

function downloadThumbZIP() {
  // Load JSZip as UMD
  if (!window.JSZip) {
    var s = document.createElement('script')
    s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'
    s.onload = function() { buildThumbZIP() }
    document.head.appendChild(s)
  } else { buildThumbZIP() }
}

function buildThumbZIP() {
  var zip = new window.JSZip()
  var folder = zip.folder('frames')
  var promises = thThumbs.map(function(th, i) {
    return fetch(th.url).then(function(r) { return r.blob() }).then(function(b) {
      folder.file('frame-' + String(i+1).padStart(3,'0') + '.jpg', b)
    })
  })
  Promise.all(promises).then(function() {
    return zip.generateAsync({ type: 'blob', compression: 'DEFLATE' })
  }).then(function(blob) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'frames.zip'; a.click()
    toast('ZIP downloaded', 'ok')
  })
}

/* --- MEDIA INFO ------------------------------------------- */
function loadMediaInfo(file) {
  if (!file) return
  var isVideo = file.type.startsWith('video/')
  var el = isVideo ? document.createElement('video') : document.createElement('audio')
  el.preload = 'metadata'
  el.src = URL.createObjectURL(file)
  el.onloadedmetadata = function() {
    var rows = [
      ['File name',  file.name],
      ['File size',  (file.size / 1024 / 1024).toFixed(2) + ' MB (' + file.size.toLocaleString() + ' bytes)'],
      ['MIME type',  file.type || 'unknown'],
      ['Duration',   el.duration ? formatTime(el.duration) + ' (' + el.duration.toFixed(3) + 's)' : 'unknown'],
      ['Last modified', new Date(file.lastModified).toLocaleString()],
    ]
    if (isVideo) {
      rows.push(['Resolution', el.videoWidth && el.videoHeight ? el.videoWidth + ' � ' + el.videoHeight + ' px' : 'unknown'])
    }
    rows.push(['Channels',    el.mozChannels || el.webkitAudioDecodedByteCount !== undefined ? '(audio info limited in browser)' : 'N/A (use ffprobe for full info)'])
    rows.push(['Browser note', 'HTMLMediaElement provides limited metadata. Use ffprobe for codec, bitrate, stream info.'])

    var tbody = document.getElementById('mi-tbody')
    tbody.innerHTML = rows.map(function(r) {
      return '<tr><td class="key">' + r[0] + '</td><td class="val">' + r[1] + '</td></tr>'
    }).join('')
    document.getElementById('mi-result').style.display = 'block'
    document.getElementById('mi-dz').querySelector('h3').textContent = '? ' + file.name
    toast('Metadata loaded', 'ok')
  }
  el.onerror = function() { toast('Could not read file metadata', 'err') }
}

function copyMediaInfo() {
  var rows = document.querySelectorAll('#mi-tbody tr')
  var text = Array.from(rows).map(function(r) {
    return r.querySelector('.key').textContent.trim() + ': ' + r.querySelector('.val').textContent.trim()
  }).join('\n')
  navigator.clipboard.writeText(text).then(function() { toast('Info copied', 'ok') })
}

/* --- NATIVE CONVERT (WebM ? MP4, Chrome only) --------------- */
function nativeConvert(file) {
  if (!file || !file.type.includes('webm')) { toast('Drop a WebM file', 'err'); return }
  // Use fetch + URL object trick � simplest approach
  var url = URL.createObjectURL(file)
  var a = document.createElement('a'); a.href = url
  // Browser doesn't actually re-encode � just serves same data with mp4 extension
  // This is a codec-copy rename that works if the codec is H.264/AAC
  document.getElementById('cv1-dl').href = url
  document.getElementById('cv1-dl').download = file.name.replace('.webm', '.mp4')
  document.getElementById('cv1-result').style.display = 'block'
  document.getElementById('cv1-err').style.display = 'none'
  toast('Ready � note: works in Chrome when codec is H.264', 'info')
}

/* --- FFMPEG.WASM (attempt load) --------------------------- */
var ffmpegLoaded = false, ffmpegInst = null

function tryLoadFFmpeg() {
  var status = document.getElementById('ffmpeg-status')
  status.textContent = 'Checking SharedArrayBuffer support�'

  if (!window.SharedArrayBuffer) {
    status.innerHTML = '? <strong>SharedArrayBuffer is not available.</strong> This browser/server does not send the required COOP/COEP headers. See the explanation below.'
    status.style.color = '#f87171'
    return
  }

  status.textContent = 'SharedArrayBuffer available ? � Loading ffmpeg.wasm (~30MB)�'
  status.style.color = 'var(--green)'

  // Load ffmpeg via module script and expose to window
  var s = document.createElement('script'); s.type = 'module'
  s.textContent = [
    "import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js'",
    "import { toBlobURL } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js'",
    "window.__FFmpeg = FFmpeg; window.__toBlobURL = toBlobURL; window.__ffmpegModReady = true",
  ].join('\n')
  s.onerror = function() {
    document.getElementById('ffmpeg-status').textContent = '? Module load failed'
    document.getElementById('ffmpeg-status').style.color = '#f87171'
  }
  document.head.appendChild(s)

  var poll = setInterval(function() {
    if (!window.__ffmpegModReady) return
    clearInterval(poll)
    status.textContent = 'Initialising ffmpeg.wasm core�'
    var ff = new window.__FFmpeg()
    ff.on('log', function(msg) {
      document.getElementById('ff-log').textContent = (msg.message || '').slice(0, 120)
    })
    var base = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm'
    Promise.all([
      window.__toBlobURL(base + '/ffmpeg-core.js',   'text/javascript'),
      window.__toBlobURL(base + '/ffmpeg-core.wasm', 'application/wasm'),
    ]).then(function(urls) {
      return ff.load({ coreURL: urls[0], wasmURL: urls[1] })
    }).then(function() {
      ffmpegInst = ff; ffmpegLoaded = true
      status.textContent = '? ffmpeg.wasm loaded successfully!'
      status.style.color = 'var(--green)'
      document.getElementById('ffmpeg-ui').style.display = 'block'
      toast('ffmpeg.wasm ready', 'ok')
    }).catch(function(e) {
      status.innerHTML = '? Load failed: ' + e.message + '<br>This usually means the server did not send COOP/COEP headers.'
      status.style.color = '#f87171'
    })
  }, 200)
}

async function ffmpegConvert(file) {
  if (!ffmpegLoaded || !ffmpegInst) { toast('Load ffmpeg.wasm first', 'err'); return }
  var op  = document.getElementById('ff-op').value
  var fmt = document.getElementById('ff-fmt').value
  var inName = file.name

  document.getElementById('ff-prog').style.display = 'block'
  document.getElementById('ff-result').style.display = 'none'
  document.getElementById('ff-prog-fill').style.width = '15%'

  try {
    var { fetchFile } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js')
    await ffmpegInst.writeFile(inName, await fetchFile(file))
    document.getElementById('ff-prog-fill').style.width = '50%'

    var outName, args
    if (op === 'audio') {
      outName = 'output.mp3'
      args = ['-i', inName, '-vn', '-acodec', 'libmp3lame', '-q:a', '2', outName]
    } else if (op === 'trim') {
      outName = 'trimmed.' + (inName.split('.').pop() || 'mp4')
      args = ['-i', inName, '-ss', document.getElementById('ff-start').value, '-to', document.getElementById('ff-end').value, '-c', 'copy', outName]
    } else {
      outName = 'output.' + fmt
      args = ['-i', inName, outName]
    }

    await ffmpegInst.exec(args)
    document.getElementById('ff-prog-fill').style.width = '90%'
    var data = await ffmpegInst.readFile(outName)
    var blob = new Blob([data])
    var dl = document.getElementById('ff-dl')
    dl.href = URL.createObjectURL(blob); dl.download = outName
    document.getElementById('ff-prog').style.display = 'none'
    document.getElementById('ff-result').style.display = 'block'
    toast('Done: ' + outName, 'ok')
  } catch(e) {
    document.getElementById('ff-prog-fill').style.background = '#ef4444'
    document.getElementById('ff-log').textContent = '? ' + (e.message || 'Failed')
    toast('Convert failed', 'err')
  }
}

/* --- TOAST ------------------------------------------------ */
function toast(msg, type) {
  var el = document.createElement('div')
  el.className = 'toast' + (type ? ' ' + type : ''); el.textContent = msg
  document.getElementById('toasts').appendChild(el)
  setTimeout(function() { el.remove() }, 2800)
}

<!-- -- Guided Tour ------------------------------------ -->
<script>
window.__TOUR_STEPS__ = [{sel:".topbar-logo",title:"Welcome to Media Studio",body:"Browser-native media tools � audio waveform viewer, screen recorder, thumbnail extractor, and media inspector.",tip:"bottom"},{sel:".etabs",title:"5 media tools",body:"Waveform Visualizer, Screen Recorder, Thumbnail Extractor, Media Inspector, and Microphone Recorder.",tip:"bottom"},{sel:"#panel-waveform,.section-card",title:"Audio Waveform",body:"Drop any audio file to see its full waveform. Click anywhere on the waveform to seek to that position during playback.",tip:"top"},{sel:"#panel-record,.section-card",title:"Screen Recorder",body:"Record your screen and system audio using the MediaRecorder API � no extension or install required.",tip:"top"},{sel:"#panel-thumb,.section-card",title:"Thumbnail Extractor",body:"Upload a video and capture any frame as a PNG. Perfect for generating thumbnails or preview images.",tip:"top"}];
</script>
<script>
(function(){
  'use strict';
  var TOUR_KEY='ui_tour_'+(location.hostname.split('.')[0]||'tool');
  var steps=window.__TOUR_STEPS__||[];
  var current=0,active=false;
  var overlay,tipEl;

  function init(){
    if(!steps.length)return;
    overlay=document.createElement('div');
    overlay.id='tour-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','Guided tour');

    var svgNS='http://www.w3.org/2000/svg';
    var svgEl=document.createElementNS(svgNS,'svg');
    svgEl.id='tour-svg';
    svgEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9001;pointer-events:none';
    var defs=document.createElementNS(svgNS,'defs');
    var clip=document.createElementNS(svgNS,'clipPath');
    clip.id='tour-clip';
    var outerR=document.createElementNS(svgNS,'rect');
    outerR.setAttribute('width','200%');outerR.setAttribute('height','200%');
    var holeR=document.createElementNS(svgNS,'rect');
    holeR.id='tour-hole';
    clip.appendChild(outerR);clip.appendChild(holeR);defs.appendChild(clip);
    var dimR=document.createElementNS(svgNS,'rect');
    dimR.setAttribute('width','200%');dimR.setAttribute('height','200%');
    dimR.setAttribute('clip-path','url(#tour-clip)');
    dimR.setAttribute('fill','rgba(3,5,10,0.78)');
    var glowR=document.createElementNS(svgNS,'rect');
    glowR.id='tour-glow';
    glowR.setAttribute('fill','none');
    glowR.setAttribute('stroke','rgba(59,130,246,0.55)');
    glowR.setAttribute('stroke-width','2');
    svgEl.appendChild(defs);svgEl.appendChild(dimR);svgEl.appendChild(glowR);
    overlay.appendChild(svgEl);

    tipEl=document.createElement('div');
    tipEl.id='tour-tip';
    tipEl.innerHTML=
      '<div class="tour-progress"><div class="tour-progress-fill" id="tour-pfill"></div></div>'+
      '<div class="tour-step-label" id="tour-slbl"></div>'+
      '<div class="tour-tip-title" id="tour-ttl"></div>'+
      '<div class="tour-tip-body" id="tour-tbdy"></div>'+
      '<div class="tour-footer">'+
        '<div class="tour-dots" id="tour-dots"></div>'+
        '<div class="tour-nav">'+
          '<button class="tour-nav-btn tour-prev" id="tour-prev" onclick="__tourPrev()" aria-label="Previous">&#8592; Prev</button>'+
          '<button class="tour-nav-btn tour-next" id="tour-next" onclick="__tourNext()" aria-label="Next">Next &#8594;</button>'+
        '</div>'+
      '</div>'+
      '<button class="tour-skip" onclick="endTour()">Skip tour &times;</button>';
    overlay.appendChild(tipEl);
    document.body.appendChild(overlay);

    overlay.addEventListener('click',function(e){if(e.target===overlay)endTour();});
    document.addEventListener('keydown',function(e){
      if(!active)return;
      if(e.key==='Escape')endTour();
      if(e.key==='ArrowRight'||e.key==='Enter')__tourNext();
      if(e.key==='ArrowLeft')__tourPrev();
    });

    renderDots();
    var seen=localStorage.getItem(TOUR_KEY);
    if(!seen)setTimeout(function(){startTour();},1500);
  }

  function renderDots(){
    var d=document.getElementById('tour-dots');
    if(!d)return;
    d.innerHTML=steps.map(function(_,i){
      return'<div class="tour-dot'+(i===current?' active':'')+'" onclick="__tourGo('+i+')" tabindex="0" role="button" aria-label="Step '+(i+1)+'"></div>';
    }).join('');
  }

  function spotlight(el){
    if(!el)return;
    var r=el.getBoundingClientRect(),p=10,rx=10;
    var x=r.left-p,y=r.top-p,w=r.width+p*2,h=r.height+p*2;
    var hole=document.getElementById('tour-hole');
    var glow=document.getElementById('tour-glow');
    if(hole){hole.setAttribute('x',x);hole.setAttribute('y',y);hole.setAttribute('width',w);hole.setAttribute('height',h);hole.setAttribute('rx',rx);}
    if(glow){glow.setAttribute('x',x);glow.setAttribute('y',y);glow.setAttribute('width',w);glow.setAttribute('height',h);glow.setAttribute('rx',rx);}
    el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  }

  function positionTip(el,side){
    if(!tipEl||!el)return;
    tipEl.className='';
    var r=el.getBoundingClientRect();
    var tw=tipEl.offsetWidth||320,th=tipEl.offsetHeight||220;
    var vw=window.innerWidth,vh=window.innerHeight,m=16;
    var top,left,arrow;
    if(side==='bottom'&&r.bottom+th+m<vh){top=r.bottom+m;left=r.left;arrow='top';}
    else if(side==='top'&&r.top-th-m>0){top=r.top-th-m;left=r.left;arrow='bottom';}
    else if(side==='right'&&r.right+tw+m<vw){top=r.top;left=r.right+m;arrow='left';}
    else if(side==='left'&&r.left-tw-m>0){top=r.top;left=r.left-tw-m;arrow='right';}
    else{top=Math.min(r.bottom+m,vh-th-m);left=r.left;arrow='top';}
    left=Math.max(m,Math.min(left,vw-tw-m));
    top=Math.max(m+56,Math.min(top,vh-th-m));
    tipEl.style.top=top+'px';tipEl.style.left=left+'px';
    tipEl.classList.add('arrow-'+arrow);
  }

  function renderStep(idx){
    if(idx<0||idx>=steps.length)return;
    current=idx;
    var step=steps[idx],total=steps.length;
    var el=step.sel?document.querySelector(step.sel):null;
    document.getElementById('tour-slbl').textContent='Step '+(idx+1)+' of '+total;
    document.getElementById('tour-ttl').textContent=step.title||'';
    document.getElementById('tour-tbdy').textContent=step.body||'';
    var pf=document.getElementById('tour-pfill');
    if(pf)pf.style.width=Math.round(((idx+1)/total)*100)+'%';
    var prev=document.getElementById('tour-prev');
    var next=document.getElementById('tour-next');
    if(prev)prev.style.display=idx===0?'none':'';
    if(next)next.textContent=idx===total-1?'Finish \u2713':'Next \u2192';
    document.querySelectorAll('.tour-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
    if(el){
      spotlight(el);
      setTimeout(function(){positionTip(el,step.tip||'bottom');},80);
    }else{
      var hole=document.getElementById('tour-hole');
      if(hole){hole.setAttribute('width','0');hole.setAttribute('height','0');}
      tipEl.style.top='50%';tipEl.style.left='50%';
      tipEl.style.transform='translate(-50%,-50%)';
    }
  }

  window.__tourGo=function(i){if(active)renderStep(i);};
  window.__tourNext=function(){if(!active)return;if(current>=steps.length-1){endTour();return;}renderStep(current+1);};
  window.__tourPrev=function(){if(active&&current>0)renderStep(current-1);};

  window.startTour=function(){
    if(!steps.length)return;
    active=true;current=0;
    overlay.classList.add('active');
    document.body.style.overflow='hidden';
    renderStep(0);
  };

  window.endTour=function(){
    active=false;
    if(overlay)overlay.classList.remove('active');
    document.body.style.overflow='';
    localStorage.setItem(TOUR_KEY,'1');
  };

  window.resetTour=function(){localStorage.removeItem(TOUR_KEY);};

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init);
  }else{
    setTimeout(init,0);
  }
})();

</script>
